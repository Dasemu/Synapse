name: synapse
description: "Synapse: a native second brain: outliner notes with linked pages and journals."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  path_provider: ^2.1.6
  synapse_ffi:
    path: rust_builder
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/modules/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-BoldItalic.ttf
          weight: 700
          style: italic
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Variable.ttf
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-Regular.otf
        - asset: assets/fonts/SourceCodePro-Semibold.otf
          weight: 600
