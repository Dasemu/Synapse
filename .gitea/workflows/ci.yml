name: CI

# Lint + unit tests, using the same `bb dev:lint-and-test` task documented in
# CLAUDE.md / AGENTS.md. Runs on pushes and on PRs against main (no
# `development` branch exists in this repo).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: 1.12.5.1664
          bb: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Lint and test
        run: bb dev:lint-and-test
