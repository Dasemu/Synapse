[package]
name = "synapse-secrets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Synapse module: an encrypted vault of secrets"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
synapse-module-sdk = { path = "../sdk" }
