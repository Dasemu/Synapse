[package]
name = "synapse-caldav"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CalDAV events and VTODO tasks, two-way with Synapse blocks and journals"

[dependencies]
synapse-core.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
rusqlite.workspace = true
quick-xml = "0.42.0"
rrule = "0.14.0"
chrono-tz = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.10"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
