[package]
name = "synapse-ai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Provider-agnostic AI for Synapse: chat, embeddings and graph-aware features"

[dependencies]
synapse-core.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
async-trait = "0.1.92"
futures-util = "0.3.34"
tokio-util = "0.7.20"
tokio = { version = "1.54.0", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.10"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6.5"
