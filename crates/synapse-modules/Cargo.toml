[package]
name = "synapse-modules"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Sandboxed WebAssembly modules for Synapse: manifest, permissions, host API, registry"

[dependencies]
argon2 = "0.6"
base64 = "0.22"
chacha20poly1305 = "0.11"
getrandom = "0.4"
serde.workspace = true
serde_json.workspace = true
synapse-core.workspace = true
thiserror.workspace = true
# Portable loop dispatch: the default tail-call dispatch overflows the stack in debug builds
# and depends on the optimiser per target (Android, Windows); hot paths (crypto) are native.
wasmi = { version = "2", default-features = false, features = ["std", "stable", "validate", "portable-dispatch"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
wat = "1"
